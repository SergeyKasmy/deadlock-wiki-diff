<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- cdn.deadlock.wiki rejects hotlinks that carry a foreign Referer -->
<meta name="referrer" content="no-referrer">
<title>Deadlock ability comparison</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #141414; color: oklch(0.953948 0.0168318 58.6608); font: 15px/1.4 Inter, system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 10; background: #141414ee; backdrop-filter: blur(6px); border-bottom: 1px solid #2a2a2a; padding: 10px 16px; }
header .bar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
header h1 { font-size: 1.1rem; margin: 0 auto 0 0; flex: 0 1 auto; min-width: 0; }
/* the revision labels are long, so the selects shrink (ellipsis) and wrap instead of widening the page */
label { display: flex; flex-direction: column; gap: 2px; font-size: .75rem; color: #aaa; flex: 1 1 240px; min-width: 0; }
label.check { flex: 0 0 auto; cursor: pointer; font-size: .85rem; color: inherit; }
label select { width: 100%; min-width: 0; text-overflow: ellipsis; }
select, button.swap { background: #232323; color: inherit; border: 1px solid #3a3a3a; border-radius: 4px; padding: 6px 8px; font: inherit; }
button.swap { cursor: pointer; }
#status { max-width: 1100px; margin: 4px auto 0; font-size: .8rem; color: #aaa; min-height: 1.2em; }
#status.err { color: #ff8a8a; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
.row h2 { font-size: 1rem; margin: 22px 0 6px; display: flex; gap: 10px; align-items: baseline; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.side { display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
/* the wiki's card CSS is scoped to .mw-parser-output; the colour/font pin keeps cards identical to the wiki */
.side.mw-parser-output { color: oklch(0.953948 0.0168318 58.6608); font-family: Inter, sans-serif; --link-color: #60f8b3; }
.side a { color: var(--link-color); }
/* The wiki masks this backdrop with a torn-paper PNG. CSS masks are fetched in CORS mode and cdn.deadlock.wiki only
   allows its own origin, so the mask is blocked here and the unmasked backdrop would show as a stray shape. */
.side.mw-parser-output .infobox-h-title-hero-tornbox { display: none; }.diff-del { background: rgba(255, 70, 70, .35); border-radius: 2px; }
.diff-add { background: rgba(60, 220, 110, .3); border-radius: 2px; }
@media (max-width: 1080px) { .pair { grid-template-columns: 1fr; } }
</style>
<style id="gadget-css">
/* Codex base button rule (the wiki's skin supplies it; divs here never match the :enabled variants) */
.cdx-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;min-height:32px;max-width:28rem;margin:0;border-width:1px;border-style:solid;border-radius:2px;padding-right:11px;padding-left:11px;font-family:inherit;font-size:var(--font-size-medium,1rem);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;transition-property:background-color,color,border-color,box-shadow;transition-duration:.1s}
/* from MediaWiki:Gadget-ability-upgrades.css, with .hide scoped so it cannot leak into the page chrome */
.ability-card .hide { display: none !important; }
.ability-attr { transition: text-shadow 0.6s ease; }
.ability-attr.highlight { text-shadow: 0 0 6px rgba(255,250,0,.6), 0 0 12px rgba(255,250,0,.5), 0 0 24px rgba(255,250,0,.4); }
.ability-upgrade { transition: all 0.2s ease; cursor: pointer; }
.ability-upgrade.hovered { background-color: #3d2d52a3 !important; transform: scale(1.05); box-shadow: 0 4px 12px rgba(0,0,0,.2) !important; }
.ability-upgrade.selected { background-color: #503667 !important; }
.ability-upgrade.selected.hovered { background-color: #3d2d52a3 !important; }
.ability-upgrade-header { transition: background-color 0.2s ease; }
.ability-upgrade.selected .ability-upgrade-header { background-color: #11140E !important; transition: background-color 0.2s ease; }
</style>
<style id="wiki-css"></style>
</head>
<body>
<header>
  <div class="bar">
    <h1><select id="sel-hero" title="Hero"></select> &mdash; ability cards, old vs new</h1>
    <label>Old <select id="sel-0"></select></label>
    <button class="swap" id="swap" title="Swap sides">⇄</button>
    <label>New <select id="sel-1"></select></label>
    <label class="check"><span>&nbsp;</span><span><input type="checkbox" id="hl"> Highlight differences</span></label>
  </div>
  <div id="status">Loading revision list…</div>
</header>
<main id="main"></main>

<script>
const API = 'https://deadlock.wiki/api.php';
// Set by selectHero(); everything hero-specific (key, page title, infobox wikitext, ability count, Lang key prefix) is read from the wiki at runtime.
let HERO = null, NUM = 4;
const HERODATA_PAGE = 'Data:HeroData.json';
const DATA_PAGE = 'Data:AbilityCards.json';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const setStatus = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; };

async function api(params, post) {
  const p = new URLSearchParams({ format: 'json', formatversion: 2, origin: '*', ...params });
  const r = await (post ? fetch(API, { method: 'POST', body: p }) : fetch(`${API}?${p}`));
  if (!r.ok) throw new Error(`wiki API ${r.status}`);
  const j = await r.json();
  if (j.error) throw new Error(j.error.info);
  return j;
}

// Every Deadbot revision of a data page since the page was created; re-queried on each page load so new patches appear on their own.
async function listRevisions(title) {
  const out = [];
  let cont = {};
  do {
    const j = await api({ action: 'query', prop: 'revisions', rvprop: 'ids|timestamp|comment|user', rvlimit: 500,
      rvdir: 'newer', titles: title, ...cont });
    out.push(...j.query.pages[0].revisions);
    cont = j.continue || null;
  } while (cont);
  return out.filter(r => r.user === 'Deadbot');
}

// Deadbot saves each data page in the same patch run with the same comment label, a few minutes apart.
// Pages without a revision for a patch were unchanged, so the closest earlier revision applies.
function matchRev(list, info) {
  return list.find(r => r.comment === info.comment)
    || list.filter(r => Date.parse(r.timestamp) <= Date.parse(info.timestamp) + 3600e3).at(-1);
}

const contentCache = new Map();
let renderCache = new Map(), langRenderCache = new Map(); // reset per hero

// Whole data page at one revision (or the current one when rev is omitted); shared by all heroes.
function pageJson(title, rev) {
  const k = rev ?? title;
  if (!contentCache.has(k)) {
    const p = api({ action: 'query', prop: 'revisions', rvslots: 'main', rvprop: 'content', ...(rev ? { revids: rev } : { titles: title }) })
      .then(j => JSON.parse(j.query.pages[0].revisions[0].slots.main.content));
    contentCache.set(k, p);
    p.catch(() => contentCache.delete(k));
  }
  return contentCache.get(k);
}

async function heroSlice(rev) {
  const slice = (await pageJson(null, rev))[HERO.key];
  // unreleased heroes sit in the file as a bare { Name } stub
  if (!slice?.[1]) throw new Error(`${HERO.name} has no abilities in r${rev} yet, pick a later revision`);
  return slice;
}

// Early revisions keep Ability* stats (cooldown, cast range, duration…) at the ability's top level; the current
// card module only reads them from `Headers`, so without this the old cards lose their header boxes.
function hoistHeaders(slice) {
  for (let n = 1; n <= NUM; n++) {
    const a = slice[n];
    if (!a || a.Headers) continue;
    a.Headers = {};
    for (const [k, v] of Object.entries(a))
      if (/^Ability/.test(k) && v && typeof v === 'object') { a.Headers[k] = v; delete a[k]; }
  }
  return slice;
}

const LANG_PAGE = 'Data:Lang en.json';
let langRevs = [], heroRevs = [];

// TemplateSandbox can swap only one page per request, so the cards (old numbers) and the translations (old
// description texts) are rendered separately and merged afterwards.
async function parseWiki(text, sandboxTitle, sandboxText) {
  const sandbox = sandboxTitle ? { templatesandboxtitle: sandboxTitle, templatesandboxtext: sandboxText,
    templatesandboxcontentmodel: 'json', templatesandboxcontentformat: 'application/json' } : {};
  const j = await api({ action: 'parse', prop: 'text', contentmodel: 'wikitext', title: HERO.name, text, ...sandbox }, true);
  if (/Lua error/.test(j.parse.text)) throw new Error('render failed');
  const doc = new DOMParser().parseFromString(j.parse.text, 'text/html');
  return { css: [...doc.querySelectorAll('style')].map(s => s.textContent).join('\n'), doc };
}

// nums: the ability slots that exist in the data being rendered (early revisions of unfinished heroes can miss some);
// the result has one entry per slot, null where there is no ability.
async function renderCards(sandboxTitle, sandboxText, nums = Array.from({ length: NUM }, (_, i) => i + 1)) {
  const text = nums.map(n => `{{AbilitySection|hero_name=${HERO.name}|ability_num=${n}}}`).join('');
  const { css, doc } = await parseWiki(text, sandboxTitle, sandboxText);
  const found = [...doc.querySelectorAll('.ability-card')];
  if (found.length !== nums.length) throw new Error('render failed');
  const cards = Array(NUM).fill(null);
  nums.forEach((n, i) => { cards[n - 1] = found[i]; });
  return { css, cards };
}

// The hero card; its stats come from Data:HeroData.json, swapped for the revision of the same patch.
async function renderHero(info) {
  const hd = matchRev(heroRevs, info);
  const text = HERO.infobox;
  const { css, doc } = await parseWiki(text, hd && HERODATA_PAGE, hd && JSON.stringify({ [HERO.key]: (await pageJson(null, hd.revid))[HERO.key] }));
  const card = doc.querySelector('.infobox-h');
  if (!card) throw new Error('hero card missing');
  return { css, html: card.outerHTML };
}

// Cards rendered with the old translations but the current data: only their description elements are used.
function renderWithLang(langRev) {
  if (!langRenderCache.has(langRev)) {
    const p = (async () => {
      const lang = await pageJson(null, langRev);
      // only this hero's strings: the full file is ~1 MB
      const keep = Object.fromEntries(Object.entries(lang).filter(([k]) => k.startsWith(HERO.langPrefix) || HERO.descKeys.has(k)));
      return (await renderCards(LANG_PAGE, JSON.stringify(keep))).cards;
    })();
    langRenderCache.set(langRev, p);
    p.catch(() => langRenderCache.delete(langRev));
  }
  return langRenderCache.get(langRev);
}

// Copies description texts from the old-translation render into the old-data render, where both versions use the same DescKey.
function spliceDescriptions(card, langCard, oldAb, curAb) {
  if (!oldAb || !curAb || oldAb.Key !== curAb.Key) return;
  for (const k of [1, 2, 3]) {
    const dk = oldAb['Info' + k]?.DescKey;
    const j = dk && [1, 2, 3].find(j => curAb['Info' + j]?.DescKey === dk);
    const dst = card.querySelector(`#ability-info${k} .ac-info-desc`), src = j && langCard.querySelector(`#ability-info${j} .ac-info-desc`);
    if (dst && src) dst.innerHTML = src.innerHTML;
  }
  [1, 2, 5].forEach((cost, i) => {
    const dk = oldAb.Upgrades[i]?.DescKey;
    if (!dk || curAb.Upgrades[i]?.DescKey !== dk) return;
    const dst = card.querySelector(`#ability-upgrade-${cost} .ac-upgrade-desc`), src = langCard.querySelector(`#ability-upgrade-${cost} .ac-upgrade-desc`);
    if (dst && src) dst.replaceWith(src.cloneNode(true)); // the font size depends on the text length, so the element is copied whole
  });
}

// The wiki's own renderer with the old data page swapped in via TemplateSandbox.
// Only the hero's slice is sent (renders identically to the full file, but ~100x smaller).
async function render(rev) {
  if (!renderCache.has(rev)) {
    const p = (async () => {
      const slice = hoistHeaders(structuredClone(await heroSlice(rev)));
      const nums = Array.from({ length: NUM }, (_, i) => i + 1).filter(n => slice[n]);
      const { css, cards } = await renderCards(DATA_PAGE, JSON.stringify({ [HERO.key]: slice }), nums);
      const info = revs.find(r => r.revid === rev);
      const lang = info && matchRev(langRevs, info);
      // the newest translations are what the renderer already used
      if (lang && lang.revid !== langRevs.at(-1).revid) {
        try {
          const [langCards, cur] = await Promise.all([renderWithLang(lang.revid), heroSlice(revs.at(-1).revid)]);
          cards.forEach((c, i) => c && langCards[i] && spliceDescriptions(c, langCards[i], slice[i + 1], cur[i + 1]));
        } catch (e) { console.warn('old translations unavailable, showing current texts', e); }
      }
      let hero = null;
      try { hero = await renderHero(info); } catch (e) { console.warn('hero card unavailable', e); }
      return { slice, css: css + (hero ? '\n' + hero.css : ''), hero: hero?.html, html: cards.map(c => c?.outerHTML ?? null) };
    })();
    renderCache.set(rev, p);
    p.catch(() => renderCache.delete(rev));
  }
  return renderCache.get(rev);
}

/* ---- upgrade gadget: port of MediaWiki:Gadget-ability-upgrades.js, scoped to one card so the two sides don't share state ---- */
const COST_TO_INDEX = { 1: 0, 2: 1, 5: 2 };
const INDEX_TO_COST = { 0: 1, 1: 2, 2: 5 };
const sig = (n, s) => Math.abs(n) >= 1 ? Number(n.toFixed(3)) : Number(n.toPrecision(s));

function attachGadget(card, ability, onChange) {
  const st = [false, false, false], cache = new Map();
  const btns = [...card.querySelectorAll('.ability-upgrade')];

  const hover = el => {
    const idx = +el.dataset.index, on = el.classList.contains('selected');
    btns.forEach(b => { if ((b.classList.contains('selected') === on) && (on ? +b.dataset.index >= idx : +b.dataset.index <= idx)) b.classList.add('hovered'); });
  };
  const unhover = () => btns.forEach(b => b.classList.remove('hovered'));

  function updateElem(key, elem, value, revert, multiply) {
    if (revert) { if (cache.has(key)) elem.innerHTML = cache.get(key); }
    else {
      if (!cache.has(key)) cache.set(key, elem.innerHTML);
      const cur = parseFloat(elem.innerHTML);
      elem.innerHTML = multiply ? sig(cur * value, 3) : sig(cur + sig(parseFloat(String(value).replace(/[sm]/g, ''))), 3);
      const a = elem.closest('.ability-attr');
      if (a) { a.classList.add('highlight'); setTimeout(() => a.classList.remove('highlight'), 450); }
    }
    const box = elem.closest('.ability-headerattr, .ability-mainbox, .ability-altbox');
    if (box) box.classList.toggle('hide', elem.innerHTML.trim() === '0');
  }

  function toggle(i, enable) {
    const up = ability.Upgrades[i];
    for (const n of [1, 2, 3]) {
      const info = ability['Info' + n];
      if (info && info.RequiresUpgradeIndex === i) {
        card.querySelector('#ability-info' + n)?.classList.toggle('hide', !enable);
        break;
      }
    }
    for (const [key, v] of Object.entries(up)) {
      let value = v, multiply = false;
      if (v && typeof v === 'object') {
        let scale = v.Scale;
        if (Array.isArray(scale)) scale = scale.find(s => s.Type === 'spirit'); // several scales: only spirit is shown
        const se = card.querySelector('#' + CSS.escape(key + '-scale'));
        // shortcut: melee / weapon_power scaling needs Data:HeroData (never used by Celeste), port it when adding other heroes
        if (se && scale) updateElem(`${i}-${key}-scale`, se, scale.Type === 'weapon_power' ? scale.Value / 100 : scale.Value, !enable, scale.Multiply);
        multiply = v.Multiply;
        value = v.Value;
      }
      card.querySelectorAll('#' + CSS.escape(key)).forEach((el, n) =>
        updateElem(`${i}-${key}-${n}`, el.querySelector('b') || el, value, !enable, multiply));
    }
    st[i] = enable;
    card.querySelector('#ability-upgrade-' + INDEX_TO_COST[i])?.classList.toggle('selected', enable);
  }

  function apply(btn) {
    const i = COST_TO_INDEX[btn.id.replace('ability-upgrade-', '')];
    if (i === undefined) return;
    if (st[i]) { for (let j = 2; j >= i; j--) if (st[j]) toggle(j, false); }
    else for (let j = 0; j <= i; j++) if (!st[j]) toggle(j, true);
    unhover(); hover(btn); onChange();
  }

  btns.forEach(b => { b.addEventListener('mouseenter', () => hover(b)); b.addEventListener('mouseleave', unhover); });
  card.addEventListener('click', e => { const b = e.target.closest('.ability-upgrade'); if (b) apply(b); });
  card.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ability-upgrade')) { e.preventDefault(); e.target.click(); }
  });
}

/* ---- diff highlighting on rendered text ---- */
function textNodes(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), out = [];
  for (let n; (n = w.nextNode());) if (n.nodeValue.trim()) out.push(n);
  return out;
}

function lcsUnmatched(a, b) {
  const dp = Array.from({ length: a.length + 1 }, () => new Uint16Array(b.length + 1));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ua = new Set(a.keys()), ub = new Set(b.keys());
  for (let i = 0, j = 0; i < a.length && j < b.length;) {
    if (a[i] === b[j]) { ua.delete(i); ub.delete(j); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return [ua, ub];
}

function clearMarks(card) {
  card.querySelectorAll('.diff-wrap').forEach(s => s.replaceWith(document.createTextNode(s.textContent)));
  card.querySelectorAll('.diff-del,.diff-add').forEach(e => e.classList.remove('diff-del', 'diff-add'));
  card.normalize();
}

function mark(node, cls, card) {
  // gadget-managed value elements get the class itself: the gadget parseFloat()s their innerHTML, so nothing may be wrapped inside
  const holder = node.parentElement.closest('.ability-attr');
  if (holder && card.contains(holder)) holder.classList.add(cls);
  else {
    const s = document.createElement('span');
    s.className = `diff-wrap ${cls}`;
    node.replaceWith(s); s.append(node);
  }
}

function recompute() {
  const on = $('hl').checked;
  for (let i = 0; i <= NUM; i++) { // slot 0 is the hero card, 1..NUM the abilities
    const [L, R] = sides.map(s => s.cards[i]);
    if (L) clearMarks(L);
    if (R) clearMarks(R);
    if (!on || !L || !R) continue;
    const ln = textNodes(L), rn = textNodes(R);
    const [ul, ur] = lcsUnmatched(ln.map(n => n.nodeValue.trim()), rn.map(n => n.nodeValue.trim()));
    ul.forEach(k => mark(ln[k], 'diff-del', L));
    ur.forEach(k => mark(rn[k], 'diff-add', R));
  }
}

/* ---- page ---- */
const sides = [{ cards: [], token: 0 }, { cards: [], token: 0 }];
let allRevs = [], revs = [], heroes = []; // revs: the revisions from the selected hero's first one on

function buildRows() {
  $('main').innerHTML = Array.from({ length: NUM + 1 }, (_, i) => `
  <section class="row"><h2><span id="name-${i}">${i ? 'Ability ' + i : 'Hero card'}</span></h2>
  <div class="pair"><div class="side mw-parser-output" id="side-0-${i}"></div><div class="side mw-parser-output" id="side-1-${i}"></div></div></section>`).join('');
}

function fillRevisionSelects() {
  // the infobox holds e.g. `release_date = [[Update:February 9, 2026|February 9, 2026]]`; the first revision on or after that day is tagged
  const released = Date.parse((HERO.infobox.match(/release_date\s*=\s*(?:\[\[[^|\]]*\|)?([^\]\n|]+)/)?.[1] ?? '') + ' UTC');
  const releaseRev = revs.find(r => Date.parse(r.timestamp) >= released); // NaN (no date) matches nothing
  const opts = revs.map(r => `<option value="${r.revid}">${r.timestamp.slice(0, 10)} · ${r.comment.replace(/^deadbot /i, '')} · r${r.revid}${r === releaseRev ? ' · ★ release' : ''}</option>`).join('');
  [0, 1].forEach(s => { $('sel-' + s).innerHTML = opts; });
  return revs.indexOf(releaseRev); // -1 without a release date
}

// Every hero that has ability data and is playable; read from the wiki's current data, so new heroes show up on their own.
async function listHeroes() {
  const [ac, hd] = await Promise.all([pageJson(DATA_PAGE), pageJson(HERODATA_PAGE)]);
  return Object.keys(ac)
    .filter(k => ac[k].Name && hd[k] && !hd[k].IsDisabled && !hd[k].InDevelopment && [1, 2, 3, 4].some(n => ac[k][n]))
    .map(k => ({ key: k, name: ac[k].Name }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

// {{Infobox hero …}} with its static arguments (release date, codenames, pronouns) copied from the hero's wiki page.
async function heroInfobox(h) {
  const fallback = `{{Infobox hero|key=${h.key}}}`;
  const j = await api({ action: 'query', prop: 'revisions', rvslots: 'main', rvprop: 'content', titles: h.name, redirects: 1 });
  const wt = j.query.pages[0].revisions?.[0]?.slots.main.content ?? '';
  const start = wt.search(/\{\{\s*Infobox hero/i);
  if (start < 0) return fallback;
  let depth = 0;
  for (let i = start; i < wt.length - 1; i++) {
    const two = wt.substr(i, 2);
    if (two === '{{') { depth++; i++; } else if (two === '}}' && --depth === 0) return wt.slice(start, i + 2);
    else if (two === '}}') i++;
  }
  return fallback;
}

// Having abilities is monotonic (a hero is filled in once), so a binary search finds the first revision containing it.
async function firstRevisionWith(key) {
  if ((await pageJson(null, allRevs[0].revid))[key]?.[1]) return 0; // heroes from the start of the history need only this one fetch
  let lo = 0, hi = allRevs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if ((await pageJson(null, allRevs[mid].revid))[key]?.[1]) hi = mid; else lo = mid + 1;
  }
  return lo;
}

let heroGen = 0;
async function selectHero(key) {
  const gen = ++heroGen, h = heroes.find(x => x.key === key);
  sides.forEach(s => { s.token++; s.cards = []; });
  setStatus(`Loading ${h.name}…`);
  try {
    const [head, infobox] = await Promise.all([pageJson(DATA_PAGE).then(d => d[key]), heroInfobox(h)]);
    if (gen !== heroGen) return; // another hero was picked meanwhile
    const abilityKeys = [1, 2, 3, 4].map(n => head[n]?.Key).filter(Boolean);
    const common = abilityKeys.reduce((a, b) => { let i = 0; while (a[i] && a[i] === b[i]) i++; return a.slice(0, i); });
    HERO = { ...h, infobox,
      langPrefix: common.slice(0, common.lastIndexOf('_') + 1) || 'ability_', // e.g. ability_unicorn_
      descKeys: new Set(JSON.stringify(head).match(/"DescKey":"[^"]+"/g)?.map(m => m.slice(11, -1)) ?? []) };
    NUM = abilityKeys.length;
    renderCache = new Map(); langRenderCache = new Map();
    document.title = `${h.name} ability comparison`;
    history.replaceState(null, '', '#' + key);
    buildRows();
    const first = await firstRevisionWith(key);
    if (gen !== heroGen) return;
    revs = allRevs.slice(first); // the list starts where the hero got its abilities (Seven: the start of the history)
    // Old defaults to the release revision (earlier ones are pre-release data), or the first one without a date
    $('sel-0').selectedIndex = Math.max(0, fillRevisionSelects());
    $('sel-1').selectedIndex = revs.length - 1;
    loadSide(0); loadSide(1);
  } catch (e) { setStatus(`Failed to load ${h.name}: ${e.message}`, true); }
}

async function loadSide(s) {
  const side = sides[s], token = ++side.token, rev = +$('sel-' + s).value;
  setStatus(`Loading r${rev}…`);
  try {
    const r = await render(rev);
    if (token !== side.token) return; // a newer selection superseded this one
    $('wiki-css').textContent = r.css; // TemplateStyles are identical across versions
    side.cards = [r.hero, ...r.html].map((html, i) => {
      const host = $(`side-${s}-${i}`);
      host.innerHTML = html ?? '';
      const card = host.firstElementChild;
      if (!card) return null;
      host.querySelectorAll('a[href^="/"]').forEach(a => a.setAttribute('href', 'https://deadlock.wiki' + a.getAttribute('href')));
      const ability = i && [1, 2, 3, 4].map(n => r.slice[n]).find(a => a && a.Key === card.id.split(':')[1]);
      if (ability) attachGadget(card, ability, recompute);
      return card;
    });
    if (s === 1) sides[1].cards.forEach((c, i) => { if (i) $('name-' + i).textContent = c?.querySelector('.ac-name')?.textContent ?? ''; });
    setStatus('');
    recompute();
  } catch (e) {
    if (token === side.token) setStatus(`Failed to load r${rev}: ${e.message}`, true);
  }
}

(async () => {
  try {
    allRevs = (await listRevisions(DATA_PAGE)).filter(r => /^deadbot v/i.test(r.comment || '')); // other edits are not game patches
    // optional: without them old cards keep current texts / stats
    [langRevs, heroRevs] = await Promise.all([LANG_PAGE, HERODATA_PAGE].map(t => listRevisions(t).catch(() => [])));
    heroes = await listHeroes();
    [0, 1].forEach(s => $('sel-' + s).addEventListener('change', () => loadSide(s)));
    $('hl').addEventListener('change', recompute);
    $('sel-hero').innerHTML = heroes.map(h => `<option value="${h.key}">${h.name}</option>`).join('');
    $('sel-hero').addEventListener('change', () => selectHero($('sel-hero').value));
    $('swap').addEventListener('click', () => {
      const a = $('sel-0').value; $('sel-0').value = $('sel-1').value; $('sel-1').value = a;
      loadSide(0); loadSide(1);
    });
    const wanted = location.hash.slice(1);
    $('sel-hero').value = heroes.some(h => h.key === wanted) ? wanted : heroes[0].key;
    selectHero($('sel-hero').value);
  } catch (e) { setStatus('Failed to load revision list: ' + e.message, true); }
})();
</script>
